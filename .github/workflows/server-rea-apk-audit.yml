name: REA Android APK audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-sim-gateway/**'
      - 'apps/android-caller/**'
      - '.github/workflows/server-rea-apk-audit.yml'

permissions:
  contents: read

jobs:
  rea-inspect-mobile:
    name: Inspect compiled Android apps with REA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build the exact debug APKs to inspect
        run: |
          gradle -p apps/android-sim-gateway assembleDebug --no-daemon
          gradle -p apps/android-caller assembleDebug --no-daemon

      - name: Install the pinned JADX engine used by REA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools artifacts
          curl --fail --location --retry 3 \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar \
            --output tools/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  tools/jadx-headless-mcp-0.7.1-all.jar' | sha256sum --check
          echo "REA_JADX_MCP_JAR=$GITHUB_WORKSPACE/tools/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Decode the compiled gateway manifest with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-gateway-package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('artifacts/rea-gateway-package.json', 'utf8'));
          const strings = [];
          const visit = value => {
            if (typeof value === 'string') strings.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(input);
          const text = strings.join('\n');
          const required = [
            'com.server.gateway.MainActivity',
            'com.server.gateway.SmsGatewayService',
            'com.server.gateway.SmsStatusReceiver'
          ];
          const missing = required.filter(name => !text.includes(name));
          if (missing.length) {
            console.error('REA did not find compiled gateway components:', missing.join(', '));
            process.exit(1);
          }
          console.log('REA_GATEWAY_MANIFEST_PASS: launcher, SMS service and delivery receiver are present in the compiled APK.');
          NODE

      - name: Inspect gateway startup, pairing and real SIM SMS code with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity onCreate --json > artifacts/rea-gateway-startup-method.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity pairGateway --json > artifacts/rea-gateway-pairing-method.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.SmsGatewayService sendJob --json > artifacts/rea-gateway-sms-method.json
          : > artifacts/rea-gateway-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -n 6 >> artifacts/rea-gateway-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          for value in \
            'https://hzuovekqsjtpvmbuybxs.supabase.co' \
            'sb_publishable_denBmNsOLdaEYPjFr4JxTA_XgElA64E' \
            'Pair this gateway'
          do
            if ! grep -Fq "$value" artifacts/rea-gateway-dex-strings.txt; then
              echo "Compiled gateway DEX does not contain expected startup constant: $value" >&2
              exit 1
            fi
          done
          echo 'REA_GATEWAY_CODE_PASS: decoded startup/pairing/SMS methods and verified the compiled project defaults.'

      - name: Inspect actual Telecom WebRTC call engine and guest invitation code with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-caller-package.json
          npx --yes rea-agents@6.7.0 inspect-android-class "$APK" com.server.caller.ServerConnectionService --json > artifacts/rea-caller-telecom-class.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerConnectionService onCreateOutgoingConnection --json > artifacts/rea-caller-telecom-outgoing.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerConnectionService onCreateIncomingConnection --json > artifacts/rea-caller-telecom-incoming.json
          npx --yes rea-agents@6.7.0 inspect-android-class "$APK" com.server.caller.ServerTelecomCallEngine --json > artifacts/rea-caller-engine-class.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine placeOutgoing --json > artifacts/rea-caller-engine-outgoing.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine preparePeer --json > artifacts/rea-caller-engine-peer.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine handleSignal --json > artifacts/rea-caller-engine-signals.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine onIceConnectionChange --json > artifacts/rea-caller-engine-ice-state.json
          npx --yes rea-agents@6.7.0 inspect-android-class "$APK" com.server.caller.ServerGuestInviteNotifications --json > artifacts/rea-caller-guest-invite-class.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerGuestInviteNotifications show --json > artifacts/rea-caller-guest-invite-notification.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = name => {
            const input = JSON.parse(fs.readFileSync('artifacts/' + name, 'utf8'));
            if (input?.normalized_result?.body_status !== 'available') {
              console.error('REA did not decode a required compiled Android method: ' + name);
              process.exit(1);
            }
            return input?.normalized_result?.source?.text || '';
          };
          const checks = [
            ['rea-caller-telecom-outgoing.json', ['ServerTelecomCallEngine', 'startOutgoing']],
            ['rea-caller-telecom-incoming.json', ['ServerTelecomCallEngine', 'attachEngine']],
            ['rea-caller-engine-outgoing.json', ['api("start"', 'createLocalDescription', 'api("signal"']],
            ['rea-caller-engine-peer.json', ['createPeerConnection', 'createAudioTrack']],
            ['rea-caller-engine-signals.json', ['offer', 'answer', 'addIceCandidate']],
            ['rea-caller-engine-ice-state.json', ['CONNECTED', 'COMPLETED', 'set_active']],
            ['rea-caller-guest-invite-notification.json', ['Send invitation', 'ServerGuestInviteActivity']]
          ];
          for (const [file, markers] of checks) {
            const source = read(file);
            const missing = markers.filter(marker => !source.includes(marker));
            if (missing.length) {
              console.error('REA compiled-code inspection missing markers in ' + file + ': ' + missing.join(', '));
              process.exit(1);
            }
          }
          console.log('REA_TELECOM_WEBRTC_PASS: inspected the actual compiled ConnectionService, WebRTC engine, ICE state updates and guest invitation notification.');
          NODE
          echo 'REA inspected compiled Telecom call routing, WebRTC peer creation, SDP/ICE signalling, ICE-connected state and guest invitation handoff.'

      - name: Upload compiled APKs and REA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-rea-mobile-audit
          path: |
            artifacts/rea-gateway-package.json
            artifacts/rea-gateway-startup-method.json
            artifacts/rea-gateway-dex-strings.txt
            artifacts/rea-gateway-pairing-method.json
            artifacts/rea-gateway-sms-method.json
            artifacts/rea-caller-package.json
            artifacts/rea-caller-telecom-class.json
            artifacts/rea-caller-telecom-outgoing.json
            artifacts/rea-caller-telecom-incoming.json
            artifacts/rea-caller-engine-class.json
            artifacts/rea-caller-engine-outgoing.json
            artifacts/rea-caller-engine-peer.json
            artifacts/rea-caller-engine-signals.json
            artifacts/rea-caller-engine-ice-state.json
            artifacts/rea-caller-guest-invite-class.json
            artifacts/rea-caller-guest-invite-notification.json
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
            apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: warn

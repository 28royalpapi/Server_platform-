name: REA Android APK audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-caller/**'
      - '.github/workflows/server-rea-apk-audit.yml'

permissions:
  contents: read

jobs:
  rea-inspect-integrated-server:
    name: Inspect the one integrated Server Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build only the integrated Server Android app
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android-caller assembleDebug --no-daemon --console=plain
          test -s apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Install the pinned JADX engine used by REA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools artifacts
          curl --fail --location --retry 3 \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar \
            --output tools/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  tools/jadx-headless-mcp-0.7.1-all.jar' | sha256sum --check
          echo "REA_JADX_MCP_JAR=$GITHUB_WORKSPACE/tools/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Inspect the integrated SIM discovery, registration and SMS delivery methods
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-server-package.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerSmsGatewayManager optionsJson --json > artifacts/rea-sim-discovery.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerSmsGatewayApi registerDevice --json > artifacts/rea-sim-registration.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerSmsGatewayService sendJob --json > artifacts/rea-sms-send-job.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerSmsStatusReceiver onReceive --json > artifacts/rea-sms-delivery-callbacks.json
          : > artifacts/rea-server-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -n 6 >> artifacts/rea-server-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$')

          for value in \
            'ServerSmsGatewayManager' \
            'ServerSmsGatewayApi' \
            'ServerSmsGatewayService' \
            'ServerSmsStatusReceiver' \
            'ServerSmsGatewaySecureStore' \
            'sendMultipartTextMessage' \
            'createForSubscriptionId'
          do
            grep -Fq "$value" artifacts/rea-server-dex-strings.txt || {
              echo "Integrated Server APK is missing SMS gateway component: $value" >&2
              exit 1
            }
          done

          # The old standalone Gateway's manual URL/eight-character pairing UX
          # must not be packaged into the one Server caller app.
          for forbidden in \
            'Pair this gateway' \
            'Enter this one-time code' \
            'Project URL' \
            'Server SIM Gateway app'
          do
            if grep -Fq "$forbidden" artifacts/rea-server-dex-strings.txt; then
              echo "Legacy separate-gateway setup text is present in the integrated APK: $forbidden" >&2
              exit 1
            fi
          done

          unzip -l "$APK" > artifacts/rea-server-apk-entries.txt
          grep -Fq 'lib/arm64-v8a/libjingle_peerconnection_so.so' artifacts/rea-server-apk-entries.txt
          grep -Fq 'ServerConnectionService' artifacts/rea-server-dex-strings.txt
          grep -Fq 'ServerTelecomCallEngine' artifacts/rea-server-dex-strings.txt
          echo 'REA_ONE_SERVER_APP_SMS_GATEWAY_PASS: SIM selection, registration, SMS send and delivery callbacks are compiled into the same Server APK; no old URL/code-pairing UI is packaged.'

      - name: Upload the integrated APK and decompilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-rea-integrated-android-audit
          path: |
            artifacts/rea-*.json
            artifacts/rea-*-dex-strings.txt
            artifacts/rea-server-apk-entries.txt
            apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: warn

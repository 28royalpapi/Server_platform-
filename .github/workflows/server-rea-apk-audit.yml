name: REA Android APK audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-sim-gateway/**'
      - 'apps/android-caller/**'
      - '.github/workflows/server-rea-apk-audit.yml'

permissions:
  contents: read

jobs:
  rea-inspect-gateway:
    name: Inspect the built APK with REA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build the exact debug APKs to inspect
        run: |
          gradle -p apps/android-sim-gateway assembleDebug --no-daemon
          gradle -p apps/android-caller assembleDebug --no-daemon

      - name: Install the pinned JADX engine used by REA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --location --retry 3 \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar \
            --output tools/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  tools/jadx-headless-mcp-0.7.1-all.jar' | sha256sum --check
          echo "REA_JADX_MCP_JAR=$GITHUB_WORKSPACE/tools/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Read the compiled APK manifest and package with REA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$GITHUB_WORKSPACE/apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-gateway-package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('artifacts/rea-gateway-package.json', 'utf8'));
          const strings = [];
          const visit = value => {
            if (typeof value === 'string') strings.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(input);
          const text = strings.join('\n');
          const required = [
            'com.server.gateway.MainActivity',
            'com.server.gateway.SmsGatewayService',
            'com.server.gateway.SmsStatusReceiver'
          ];
          const missing = required.filter(name => !text.includes(name));
          if (missing.length) {
            console.error('REA APK inspection did not find required compiled components:', missing.join(', '));
            process.exit(1);
          }
          console.log('REA_APK_COMPONENT_AUDIT_PASS: decoded APK includes the explicit gateway activity, SMS service, and delivery receiver.');
          NODE

      - name: Inspect gateway startup, OTP pairing and SIM SMS methods with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity onCreate --json > artifacts/rea-gateway-startup-method.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity pairGateway --json > artifacts/rea-gateway-pairing-method.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.SmsGatewayService sendJob --json > artifacts/rea-gateway-sms-method.json
          # REA verifies the compiled call paths; DEX string-pool inspection verifies
          # the configuration constants, which Kotlin may inline into generated lambdas.
          : > artifacts/rea-gateway-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -n 6 >> artifacts/rea-gateway-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex

      - name: Inspect the compiled caller and WebRTC methods with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-caller/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-caller-package.json
          npx --yes rea-agents@6.7.0 inspect-android-class "$APK" com.server.caller.MainActivity --json > artifacts/rea-caller-main-class.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity startCall --json > artifacts/rea-caller-start-call.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity preparePeer --json > artifacts/rea-caller-prepare-peer.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity handleSignal --json > artifacts/rea-caller-handle-signal.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity onIceConnectionChange --json > artifacts/rea-caller-ice-state-sync.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('artifacts/rea-caller-ice-state-sync.json', 'utf8'));
          const source = input?.normalized_result?.source?.text || '';
          if (!source.includes('set_active')) {
            console.error('REA did not find the active-call state sync in the compiled ICE state callback.');
            process.exit(1);
          }
          console.log('REA_CALL_ACTIVE_STATE_AUDIT_PASS: the compiled ICE-connected callback requests server active-state sync.');
          NODE
          echo 'REA inspected the compiled caller entry point, WebRTC setup, offer/answer handling, and ICE-connected call-state sync.'

      - name: Upload REA evidence and inspected APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-rea-mobile-audit
          path: |
            artifacts/rea-gateway-package.json
            artifacts/rea-gateway-startup-method.json
            artifacts/rea-gateway-dex-strings.txt
            artifacts/rea-gateway-pairing-method.json
            artifacts/rea-gateway-sms-method.json
            artifacts/rea-caller-package.json
            artifacts/rea-caller-main-class.json
            artifacts/rea-caller-start-call.json
            artifacts/rea-caller-prepare-peer.json
            artifacts/rea-caller-handle-signal.json
            artifacts/rea-caller-ice-state-sync.json
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
            apps/android-caller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
)
          required=(
            'https://hzuovekqsjtpvmbuybxs.supabase.co'
            'sb_publishable_denBmNsOLdaEYPjFr4JxTA_XgElA64E'
            'Pair this gateway'
          )
          for value in "${required[@]}"; do
            if ! grep -Fq "$value" artifacts/rea-gateway-dex-strings.txt; then
              echo "Compiled gateway DEX does not contain expected startup constant: $value" >&2
              exit 1
            fi
          done
          echo 'REA_GATEWAY_STARTUP_CONFIG_PASS: REA inspected startup/pairing/SMS methods and the compiled DEX contains the expected backend URL, public key and pairing button text.'

      - name: Inspect the compiled caller and WebRTC methods with REA
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-caller/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-caller-package.json
          npx --yes rea-agents@6.7.0 inspect-android-class "$APK" com.server.caller.MainActivity --json > artifacts/rea-caller-main-class.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity startCall --json > artifacts/rea-caller-start-call.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity preparePeer --json > artifacts/rea-caller-prepare-peer.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity handleSignal --json > artifacts/rea-caller-handle-signal.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.MainActivity onIceConnectionChange --json > artifacts/rea-caller-ice-state-sync.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const input = JSON.parse(fs.readFileSync('artifacts/rea-caller-ice-state-sync.json', 'utf8'));
          const source = input?.normalized_result?.source?.text || '';
          if (!source.includes('set_active')) {
            console.error('REA did not find the active-call state sync in the compiled ICE state callback.');
            process.exit(1);
          }
          console.log('REA_CALL_ACTIVE_STATE_AUDIT_PASS: the compiled ICE-connected callback requests server active-state sync.');
          NODE
          echo 'REA inspected the compiled caller entry point, WebRTC setup, offer/answer handling, and ICE-connected call-state sync.'

      - name: Upload REA evidence and inspected APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-rea-mobile-audit
          path: |
            artifacts/rea-gateway-package.json
            artifacts/rea-gateway-startup-method.json
            artifacts/rea-gateway-pairing-method.json
            artifacts/rea-gateway-sms-method.json
            artifacts/rea-caller-package.json
            artifacts/rea-caller-main-class.json
            artifacts/rea-caller-start-call.json
            artifacts/rea-caller-prepare-peer.json
            artifacts/rea-caller-handle-signal.json
            artifacts/rea-caller-ice-state-sync.json
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
            apps/android-caller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

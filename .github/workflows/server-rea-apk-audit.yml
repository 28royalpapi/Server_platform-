name: REA Android APK audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-sim-gateway/**'
      - 'apps/android-caller/**'
      - '.github/workflows/server-rea-apk-audit.yml'

permissions:
  contents: read

jobs:
  rea-inspect-mobile:
    name: Inspect compiled Android apps with REA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build the actual Android debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/android-sim-gateway assembleDebug --no-daemon --console=plain
          gradle -p apps/android-caller assembleDebug --no-daemon --console=plain
          test -s apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
          test -s apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Install the pinned JADX engine used by REA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools artifacts
          curl --fail --location --retry 3 \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar \
            --output tools/jadx-headless-mcp-0.7.1-all.jar
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  tools/jadx-headless-mcp-0.7.1-all.jar' | sha256sum --check
          echo "REA_JADX_MCP_JAR=$GITHUB_WORKSPACE/tools/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Decode compiled gateway components and SMS delivery code
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-gateway-package.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity onCreate --json > artifacts/rea-gateway-startup.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.MainActivity pairGateway --json > artifacts/rea-gateway-pairing.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.gateway.SmsGatewayService sendJob --json > artifacts/rea-gateway-sms.json
          : > artifacts/rea-gateway-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -n 6 >> artifacts/rea-gateway-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$')
          for value in \
            'com.server.gateway.MainActivity' \
            'com.server.gateway.SmsGatewayService' \
            'com.server.gateway.SmsStatusReceiver' \
            'Pair this gateway'
          do
            grep -Fq "$value" artifacts/rea-gateway-dex-strings.txt || {
              echo "Compiled gateway DEX is missing: $value" >&2
              exit 1
            }
          done
          echo 'REA_GATEWAY_CODE_PASS'

      - name: Decode compiled Telecom, WebRTC and guest-invite components
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk"
          npx --yes rea-agents@6.7.0 inspect-android-package "$APK" --json > artifacts/rea-caller-package.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerConnectionService onCreateOutgoingConnection --json > artifacts/rea-caller-outgoing.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerConnectionService onCreateIncomingConnection --json > artifacts/rea-caller-incoming.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine startOutgoing --json > artifacts/rea-engine-start-outgoing.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine answerIncoming --json > artifacts/rea-engine-answer-incoming.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerTelecomCallEngine onIceConnectionChange --json > artifacts/rea-engine-ice-state.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerGuestInviteNotifications show --json > artifacts/rea-guest-invite-notification.json
          npx --yes rea-agents@6.7.0 inspect-android-method "$APK" com.server.caller.ServerGuestInviteShareActivity onCreate --json > artifacts/rea-guest-invite-share.json

          : > artifacts/rea-caller-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -n 6 >> artifacts/rea-caller-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$')

          for value in \
            'com.server.caller.ServerConnectionService' \
            'com.server.caller.ServerTelecomCallEngine' \
            'com.server.caller.ServerGuestInviteNotifications' \
            'com.server.caller.ServerGuestInviteShareActivity' \
            'createPeerConnection' \
            'createAudioTrack' \
            'addIceCandidate'
          do
            grep -Fq "$value" artifacts/rea-caller-dex-strings.txt || {
              echo "Compiled caller DEX is missing: $value" >&2
              exit 1
            }
          done

          unzip -l "$APK" > artifacts/rea-caller-apk-entries.txt
          grep -Fq 'lib/arm64-v8a/libjingle_peerconnection_so.so' artifacts/rea-caller-apk-entries.txt
          grep -Fq 'lib/x86_64/libjingle_peerconnection_so.so' artifacts/rea-caller-apk-entries.txt
          echo 'REA_TELECOM_WEBRTC_GUEST_PASS: compiled Android classes, guest handoff, and both phone/emulator WebRTC libraries are present.'

      - name: Upload compiled APKs and REA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-rea-mobile-audit
          path: |
            artifacts/rea-*.json
            artifacts/rea-*-dex-strings.txt
            artifacts/rea-caller-apk-entries.txt
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
            apps/android-caller/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: warn

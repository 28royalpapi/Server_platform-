name: Publish Server Android connector preview

on:
  push:
    branches: [android-finish]
    paths:
      - 'apps/android-caller/**'
      - 'web/**'
      - '.github/workflows/server-android-preview-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-android-combined-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build the single combined Server preview APK
        run: |
          set -euo pipefail
          # Build one universal APK so the website exposes one download, not
          # separate calling and gateway packages or an architecture picker.
          gradle -p apps/android-caller assembleRelease -PSERVER_ENABLE_RELEASE_ABI_SPLITS=false --no-daemon --console=plain
          APK_DIR='apps/android-caller/app/build/outputs/apk/release'
          mapfile -t APK_CANDIDATES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#APK_CANDIDATES[@]}" -ne 1 ]]; then
            echo "Expected one universal release APK after disabling ABI splits; found ${#APK_CANDIDATES[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          APK="${APK_CANDIDATES[0]}"
          test -s "$APK"
          echo "Combined APK path: $APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKSIGNER" verify --verbose "$APK"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          test "$PACKAGE_ID" = "com.server.caller"
          "$APKANALYZER" manifest print "$APK" > artifacts-server-manifest.xml
          grep -F "com.server.caller.ServerSmsGatewayService" artifacts-server-manifest.xml
          grep -F "com.server.caller.ServerSmsStatusReceiver" artifacts-server-manifest.xml
          grep -F "android.permission.SEND_SMS" artifacts-server-manifest.xml
          if grep -F "com.server.gateway" artifacts-server-manifest.xml; then
            echo "Unexpected second Gateway package reference in the combined Server manifest." >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/Server-Android-Connector-preview.apk
          ls -lh artifacts/Server-Android-Connector-preview.apk
          echo "APK_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "MANIFEST_SMS_GATEWAY=present in the same com.server.caller package" >> "$GITHUB_STEP_SUMMARY"
          echo "This preview is signed with the CI debug key for direct testing. It is not the production signing key." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: server-android-connector-preview
          path: artifacts/Server-Android-Connector-preview.apk
          if-no-files-found: error

      - name: Publish public preview download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-android-combined-preview
          target_commitish: ${{ github.sha }}
          name: Server Android — Combined Calling + SMS Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/Server-Android-Connector-preview.apk
          body: |
            Server Android connector preview for the website-led onboarding flow.

            - One Android package contains the Server calling connector and optional SIM SMS gateway.
            - Server ID creation, Android Telecom setup, and Server-to-Server calling do not require a selected SIM.
            - The optional gateway sends invitation SMS via the user's own SIM and carrier plan; it does not create PSTN calls.
            - Enable Server under Android Calling accounts when prompted.
            - This is a preview build signed with a CI debug key, not a production Play Store build. It may require uninstalling a prior preview signed with a different key.
            - Server-to-Server calls require both devices online. Calls to people without Server use an internet browser invitation; they do not become PSTN calls.

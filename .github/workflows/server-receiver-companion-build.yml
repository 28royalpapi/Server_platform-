name: Test offline wake-up inside the single Server Android app

on:
  pull_request:
    branches: [android-finish]
    paths:
      - 'apps/android-caller/**'
      - 'web/receiver.html'
      - 'web/receiver.js'
      - '.github/workflows/server-receiver-companion-build.yml'
  push:
    branches: [feat/server-receiver-persistent-enrolment]
    paths:
      - 'apps/android-caller/**'
      - 'web/receiver.html'
      - 'web/receiver.js'
      - '.github/workflows/server-receiver-companion-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-single-apk-offline-wake-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  gsm-screening-smoke:
    name: Build one Server APK and test Android GSM receiver wake-up
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build and signature-check the single Server APK and test APK
        run: |
          set -euo pipefail
          build_ok=0
          for attempt in 1 2 3; do
            echo "Single Server APK build attempt $attempt/3"
            if gradle -p apps/android-caller assembleDebug assembleDebugAndroidTest --no-daemon --console=plain --stacktrace; then
              build_ok=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Gradle dependency/build request failed; retrying after a short backoff."
              sleep 20
            fi
          done
          test "$build_ok" -eq 1
          APK_DIR=apps/android-caller/app/build/outputs/apk/debug
          APP_APK=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" | grep -F 'lib/x86_64/libjingle_peerconnection_so.so' >/dev/null; then
              APP_APK="$candidate"
              break
            fi
          done < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' ! -name '*androidTest*' | sort)
          test -n "$APP_APK"
          TEST_APK=apps/android-caller/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APP_APK"
          test -s "$TEST_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APP_APK"
          mkdir -p artifacts
          cp "$APP_APK" artifacts/Server-Android-debug.apk
          sha256sum artifacts/Server-Android-debug.apk
          ls -lh artifacts/Server-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: server-single-apk-offline-wake-test
          path: artifacts/Server-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 480
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          pre-emulator-launch-script: |
            set -eu
            adb start-server
            adb devices -l
          script: |
            set -euo pipefail
            APP=artifacts/Server-Android-debug.apk
            TEST=apps/android-caller/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test -s "$APP"
            test -s "$TEST"
            adb install "$APP"
            adb install "$TEST"
            PACKAGE=com.server.caller.debug
            RUNNER=com.server.caller.debug.test/androidx.test.runner.AndroidJUnitRunner
            adb shell cmd role add-role-holder --user 0 android.app.role.CALL_SCREENING "$PACKAGE"
            adb shell pm grant "$PACKAGE" android.permission.READ_CONTACTS
            adb shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS
            adb shell svc wifi disable
            adb emu gsm voice home
            adb emu gsm data off
            adb shell settings put global airplane_mode_on 0
            adb shell am instrument -w -e class com.server.caller.OfflineWakeReceiverSmokeTest#seedKnownServerCallerAndVerifyLocalMatch "$RUNNER"
            adb emu gsm call +2348012345678
            sleep 3
            adb shell am instrument -w -e class com.server.caller.OfflineWakeReceiverSmokeTest#gsmWakeCallProducesServerNotification "$RUNNER"
            adb emu gsm cancel +2348012345678 || true
            adb emu gsm call +2348098765432
            sleep 3
            adb shell am instrument -w -e class com.server.caller.OfflineWakeReceiverSmokeTest#gsmWakeCallFromDifferentServerCallerProducesServerNotification "$RUNNER"
            adb emu gsm cancel +2348098765432 || true
            echo "PASS: the single Server app recognised GSM wake calls from two different opted-in callers and posted caller-specific notifications."

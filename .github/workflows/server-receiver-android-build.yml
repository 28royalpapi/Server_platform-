name: Build Server Receiver Android preview

on:
  push:
    branches: [feat/server-receiver-persistent-enrolment]
    paths:
      - 'apps/android-caller/**'
      - '.github/workflows/server-receiver-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-receiver-android-preview
  cancel-in-progress: true

jobs:
  build:
    name: Compile Server Android caller with Receiver Manager
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build the integrated Server APK
        run: |
          set -euo pipefail
          gradle -p apps/android-caller assembleDebug --no-daemon --console=plain --stacktrace
          APK_DIR=apps/android-caller/app/build/outputs/apk/debug
          echo "Debug APK output directory:"
          find "$APK_DIR" -maxdepth 2 -type f -name '*.apk' -print
          APK="$(find "$APK_DIR" -maxdepth 2 -type f -name '*.apk' ! -name '*androidTest*' | sort | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "Verifying APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Server-Receiver-Manager-debug.apk
          sha256sum artifacts/Server-Receiver-Manager-debug.apk
          ls -lh artifacts/Server-Receiver-Manager-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: server-receiver-manager-android-apk
          path: artifacts/Server-Receiver-Manager-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Server Android single-app SIM gateway smoke

on:
  workflow_dispatch:
  push:
    branches: [main, android-finish]
    paths:
      - 'apps/android-caller/**'
      - 'web/**'
      - 'scripts/android-gateway-launch-smoke.sh'
      - '.github/workflows/server-android-launch-smoke.yml'

permissions:
  contents: read

jobs:
  integrated-sim-gateway:
    name: Build and launch the integrated Server app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Build the single Server Connector APK
        run: gradle -p apps/android-caller assembleDebug --no-daemon --console=plain --stacktrace

      - name: Install and launch Server in a hosted Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 480
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -memory 4096 -cores 2
          disable-animations: true
          script: bash scripts/android-gateway-launch-smoke.sh

      - name: Save single-app gateway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-android-integrated-sim-gateway-smoke
          path: |
            artifacts/server-app-manifest.txt
            artifacts/server-app-am-start.txt
            artifacts/server-app-activities.txt
            artifacts/server-app-activity-top.txt
            artifacts/server-app-launch-logcat.txt
            artifacts/server-app-package-manager-logcat.txt
            artifacts/server-app-screen.png
            apps/android-caller/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

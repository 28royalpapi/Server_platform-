name: Server Android gateway launch smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-sim-gateway/**'
      - 'scripts/android-gateway-launch-smoke.sh'
      - '.github/workflows/server-android-launch-smoke.yml'

permissions:
  contents: read

jobs:
  gateway-launch:
    name: Build and launch SIM gateway in hosted Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build gateway APK
        run: gradle -p apps/android-sim-gateway assembleDebug --no-daemon

      - name: Install and launch the gateway in a hosted Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -memory 2048 -cores 2
          disable-animations: true
          script: bash scripts/android-gateway-launch-smoke.sh

      - name: Save emulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-android-gateway-launch-evidence
          path: |
            artifacts/server-gateway-am-start.txt
            artifacts/server-gateway-activities.txt
            artifacts/server-gateway-activity-top.txt
            artifacts/server-gateway-launch-logcat.txt
            artifacts/server-gateway-screen.png
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

name: Build Server Receiver offline-wake proof

on:
  push:
    branches: [feat/server-offline-wake-native-poc]
    paths:
      - 'apps/android-receiver/**'
      - '.github/workflows/server-offline-wake-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-offline-wake-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Run unit tests and build Receiver
        run: |
          set -euo pipefail
          gradle -p apps/android-receiver testDebugUnitTest assembleDebug --no-daemon --console=plain --stacktrace
          APK=apps/android-receiver/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Server-Receiver-offline-wake-debug.apk
          sha256sum artifacts/Server-Receiver-offline-wake-debug.apk
          ls -lh artifacts/Server-Receiver-offline-wake-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: server-receiver-offline-wake-android-apk
          path: artifacts/Server-Receiver-offline-wake-debug.apk
          if-no-files-found: error
          retention-days: 14

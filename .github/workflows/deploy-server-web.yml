name: Deploy Server onboarding website
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-server-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: server-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload onboarding website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy onboarding website
        id: deployment
        uses: actions/deploy-pages@v4

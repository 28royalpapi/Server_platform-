name: Validate Server onboarding website
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/server-web/**'
      - '.github/workflows/deploy-server-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/functions/server-web/**'
      - '.github/workflows/deploy-server-web.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-web-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check onboarding and guest browser code
        run: |
          npm run check
          npm run check:web
          npm run check:live

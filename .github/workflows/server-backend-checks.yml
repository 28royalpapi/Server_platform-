name: Server backend and web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: server-backend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static backend and browser checks
        run: |
          npm run check
          npm run check:web
      - name: Test live Supabase function contracts without sending real SMS
        run: npm run check:live

name: Import native source archive
on:
  push:
    paths:
      - "native-source.tgz.b64"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import native projects
        run: |
          set -euo pipefail
          test -s native-source.tgz.b64
          base64 --decode native-source.tgz.b64 | tar -xz
          rm native-source.tgz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/build-server-native.yml
          git add -u
          git commit -m "Import Server Android and iOS client source"
          git push origin main
      - name: Run native build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-server-native.yml --ref main

name: Import native source archive
on:
  push:
    paths:
      - "native-source-ready.txt"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  import-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and import native projects
        shell: bash
        run: |
          set -euo pipefail
          test -s native-source-ready.txt
          test "$(find .bootstrap -maxdepth 1 -name 'native-apps-*.b64' | wc -l)" -eq 7
          cat .bootstrap/native-apps-00.b64 .bootstrap/native-apps-01.b64 .bootstrap/native-apps-02.b64 .bootstrap/native-apps-03.b64 .bootstrap/native-apps-04a.b64 .bootstrap/native-apps-04b.b64 .bootstrap/native-apps-05.b64 | base64 --decode > /tmp/server-native-import.tar.gz
          echo "12129d23af21288aa1c7edc5f8299f25e1462119368ce694a515af5b61896a3e  /tmp/server-native-import.tar.gz" | sha256sum --check -
          tar -tzf /tmp/server-native-import.tar.gz
          tar -xzf /tmp/server-native-import.tar.gz
          test -s apps/android-caller/app/src/main/java/com/server/caller/MainActivity.kt
          test -s apps/android-sim-gateway/app/src/main/java/com/server/gateway/MainActivity.kt
          test -s apps/ios-caller/ServerCaller/ServerViewModel.swift
          test -s .github/workflows/build-server-native.yml
          rm .bootstrap/native-apps-*.b64 native-source-ready.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git add -u .bootstrap native-source-ready.txt
          git commit -m "Import Server Android and iOS client source"
          git push origin main

name: Import native source archive
on:
  push:
    paths:
      - "native-source-ready.txt"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import native projects
        run: |
          set -euo pipefail
          test -s native-source-ready.txt
          test "$(find .bootstrap -maxdepth 1 -name 'native-apps-*.b64' | wc -l)" -eq 6
          cat .bootstrap/native-apps-*.b64 | base64 --decode | tar -xz
          rm .bootstrap/native-apps-*.b64 native-source-ready.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/build-server-native.yml
          git add -u
          git commit -m "Import Server Android and iOS client source"
          git push origin main
      - name: Trigger Android and iOS build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-server-native.yml --ref main

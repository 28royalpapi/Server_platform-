name: Build Server native clients and emulator previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-caller/**'
      - 'apps/android-sim-gateway/**'
      - 'apps/ios-caller/**'
      - '.github/workflows/build-server-native.yml'
      - 'supabase/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
concurrency:
  group: server-native-${{ github.ref }}-kvm
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-source-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source contracts and browser JavaScript
        run: |
          npm run check
          npm run check:web
      - name: Probe deployed Supabase functions without triggering real SMS
        run: npm run check:live

  android-build-and-emulator-smoke:
    # GitHub Ubuntu runners expose /dev/kvm; grant the job user access before emulator-runner probes it.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: this GitHub runner does not expose /dev/kvm; hardware-accelerated Android acceptance tests cannot run here." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Build Server caller and SIM gateway
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_SERVER_CALLER_START $(date -u +%FT%TZ)"
          timeout 480s gradle -p apps/android-caller assembleDebug --no-daemon --console=plain --stacktrace
          echo "BUILD_SERVER_CALLER_COMPLETE $(date -u +%FT%TZ)"
          timeout 480s gradle -p apps/android-sim-gateway assembleDebug --no-daemon --console=plain --stacktrace
          echo "BUILD_SIM_GATEWAY_COMPLETE $(date -u +%FT%TZ)"
      - name: Compile Android instrumentation tests before booting emulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          echo "COMPILE_ANDROID_TESTS_START $(date -u +%FT%TZ)"
          timeout 420s gradle -p apps/android-caller compileDebugAndroidTestKotlin --no-daemon --console=plain --stacktrace
          echo "COMPILE_ANDROID_TESTS_COMPLETE $(date -u +%FT%TZ)"
      - name: Upload built Android APKs before emulator smoke test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-android-debug-apks
          path: |
            apps/android-caller/app/build/outputs/apk/debug/app-debug.apk
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Run Android phone emulator UI smoke test
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          # Use an x86_64 system image with KVM acceleration; API 34 supports subscription-slot APIs.
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-snapshot-save
          pre-emulator-launch-script: |
            # This hook is launched by /bin/sh, not Bash; pipefail is not POSIX.
            set -eu
            echo "ADB_PRESTART_START $(date -u +%FT%TZ)"
            adb start-server
            adb devices -l
            echo "HOST_ARCH=$(uname -m)"
            "$ANDROID_HOME/emulator/emulator" -version
            echo "ADB_PRESTART_COMPLETE $(date -u +%FT%TZ)"
          script: |
            bash scripts/android-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-android-build-and-startup-recording
          path: |
            apps/android-caller/app/build/outputs/apk/debug/app-debug.apk
            apps/android-sim-gateway/app/build/outputs/apk/debug/app-debug.apk
            apps/android-caller/app/build/outputs/androidTest-results/**
            artifacts/**
          if-no-files-found: warn

  ios-simulator-build-and-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve WebRTC and build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project apps/ios-caller/ServerCaller.xcodeproj -scheme ServerCaller
          xcodebuild -project apps/ios-caller/ServerCaller.xcodeproj -scheme ServerCaller -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee /tmp/server-ios-build.log
      - name: Launch in iOS Simulator and record startup screen
        shell: bash
        run: |
          set -euo pipefail
          SIM_UDID=$(xcrun simctl list devices available | awk '/iPhone/ { if (match($0, /\([0-9A-F-]+\)/)) {print substr($0,RSTART+1,RLENGTH-2); exit}}')
          if [ -z "$SIM_UDID" ]; then echo 'No iPhone Simulator device was available.'; exit 1; fi
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/ServerCaller.app' -print -quit)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then echo "Built ServerCaller.app not found."; find ~/Library/Developer/Xcode/DerivedData -path '*ServerCaller.app' -maxdepth 12 -print || true; exit 1; fi
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          mkdir -p artifacts
          xcrun simctl io "$SIM_UDID" recordVideo artifacts/server-ios-startup.mp4 & REC_PID=$!
          cleanup_recorder() { kill -INT "$REC_PID" 2>/dev/null || true; wait "$REC_PID" 2>/dev/null || true; }
          trap cleanup_recorder EXIT
          sleep 2
          if ! LAUNCH_OUTPUT=$(xcrun simctl launch --terminate-running-process "$SIM_UDID" com.server.caller 2>&1); then
            echo "ERROR: ServerCaller failed to launch:"
            echo "$LAUNCH_OUTPUT"
            xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --predicate 'process == "ServerCaller" OR eventMessage CONTAINS[c] "com.server.caller"' || true
            CRASH_REPORT=$(find ~/Library/Logs/DiagnosticReports -maxdepth 1 -type f -name 'ServerCaller-*.ips' -mmin -15 -print 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$CRASH_REPORT" ]; then cp "$CRASH_REPORT" artifacts/ServerCaller-crash.ips; echo '--- ServerCaller crash report ---'; cat "$CRASH_REPORT"; fi
            exit 1
          fi
          echo "$LAUNCH_OUTPUT"
          if ! echo "$LAUNCH_OUTPUT" | grep -Eq 'com\.server\.caller: [0-9]+'; then
            echo "ERROR: simctl did not confirm a running ServerCaller process."
            xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --predicate 'process == "ServerCaller" OR eventMessage CONTAINS[c] "com.server.caller"' || true
            CRASH_REPORT=$(find ~/Library/Logs/DiagnosticReports -maxdepth 1 -type f -name 'ServerCaller-*.ips' -mmin -15 -print 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$CRASH_REPORT" ]; then cp "$CRASH_REPORT" artifacts/ServerCaller-crash.ips; fi
            exit 1
          fi
          sleep 8
          xcrun simctl io "$SIM_UDID" screenshot artifacts/server-ios-startup.png
          cat > /tmp/check-server-ios-screen.swift <<'SWIFT'
          import AppKit
          import Foundation
          import Vision

          func fail(_ message: String) -> Never {
              fputs("IOS_UI_SMOKE_FAIL: \(message)\n", stderr)
              exit(1)
          }

          let imageURL = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let image = NSImage(contentsOf: imageURL) else { fail("Cannot open simulator screenshot.") }
          var proposed = CGRect(origin: .zero, size: image.size)
          guard let cgImage = image.cgImage(forProposedRect: &proposed, context: nil, hints: nil) else {
              fail("Cannot decode simulator screenshot.")
          }
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          do {
              try VNImageRequestHandler(cgImage: cgImage).perform([request])
          } catch {
              fail("Vision OCR failed: \(error)")
          }
          let recognized = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: "\n")
          print("iOS simulator visible-screen OCR:\n\(recognized)")
          let hasBrand = recognized.localizedCaseInsensitiveContains("SERVER")
          let hasSetupHeading = recognized.localizedCaseInsensitiveContains("Set up Server on this iPhone")
          let hasCreateIdentity = recognized.localizedCaseInsensitiveContains("Create Server identity")
          let hasCallingDisclosure = recognized.localizedCaseInsensitiveContains("How iPhone calling works")
          guard hasBrand && hasSetupHeading && hasCreateIdentity && hasCallingDisclosure else {
              fail("Server did not render its setup and default-calling integration screen.")
          }
          print("IOS_UI_SMOKE_PASS: Server setup and default-calling integration UI rendered.")
          SWIFT
          if ! swift /tmp/check-server-ios-screen.swift artifacts/server-ios-startup.png; then
            echo "IOS_UI_SMOKE_FAIL: dumping recent crash diagnostics"
            CRASH_REPORT=$(find ~/Library/Logs/DiagnosticReports -maxdepth 1 -type f -name 'ServerCaller-*.ips' -mmin -30 -print 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$CRASH_REPORT" ]; then
              cp "$CRASH_REPORT" artifacts/ServerCaller-crash.ips
              echo '--- ServerCaller crash report ---'
              cat "$CRASH_REPORT"
            fi
            xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact --predicate 'process == "ServerCaller" OR eventMessage CONTAINS[c] "com.server.caller"' || true
            exit 1
          fi
          cleanup_recorder
          trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-ios-build-and-startup-recording
          path: |
            artifacts/**
            /tmp/server-ios-build.log
          if-no-files-found: warn

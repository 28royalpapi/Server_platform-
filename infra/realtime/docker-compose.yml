services:
  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - server-realtime-redis:/data
    networks:
      - server-realtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v6.9.7
    command: ["centrifugo", "-c", "config.json"]
    env_file:
      - .env
    environment:
      CENTRIFUGO_HTTP_SERVER_PORT: "8000"
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://redis:6379
      CENTRIFUGO_ADMIN_ENABLED: "false"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: '["https://server-onboarding-ochre.vercel.app"]'
    volumes:
      - ./config.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    networks:
      - server-realtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  server-realtime:
    driver: bridge

volumes:
  server-realtime-redis:

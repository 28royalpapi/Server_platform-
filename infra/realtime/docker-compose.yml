services:
  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD in infra/realtime/.env}
    volumes:
      - server-realtime-redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD in infra/realtime/.env}
    networks:
      - server-realtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      REALTIME_HOST: ${REALTIME_HOST:?Set a public DNS hostname in infra/realtime/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - server-realtime-caddy-data:/data
      - server-realtime-caddy-config:/config
    networks:
      - server-realtime
    depends_on:
      - centrifugo
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6.9.7
    command: ["centrifugo", "-c", "config.json"]
    env_file:
      - .env
    environment:
      CENTRIFUGO_HTTP_SERVER_PORT: "8000"
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://:${REDIS_PASSWORD:?Set a unique REDIS_PASSWORD in infra/realtime/.env}@redis:6379
      CENTRIFUGO_ADMIN_ENABLED: "false"
    volumes:
      - ./config.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    networks:
      - server-realtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  server-realtime:
    driver: bridge

volumes:
  server-realtime-redis:
  server-realtime-caddy-data:
  server-realtime-caddy-config:
